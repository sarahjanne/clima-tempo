[project]
name = "ChoveAi"
version = "0.1.0"
description = ""
authors = [
    {name = "Sarah Janne",email = "sarahjanne.enos@hotmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "requests (>=2.32.0,<3.0.0)",
    "uvicorn (>=0.30.0,<1.0.0)"
]

[tool.poetry]
packages = [
    { include = "controllers" },
